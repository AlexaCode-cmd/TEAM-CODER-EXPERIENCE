<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEAM CODER EXPERIENCE - Bienvenida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bienvenida.css">
</head>

<body class="pagina-bienvenida">

  <div class="tarjeta-bienvenida">
    <img src="assets/img/Movilis Logo Texto Violeta.png" alt="Movilis Instituto Superior Tecnológico"
      class="logo-movilis-completo">
    <h1>TEAM CODER EXPERIENCE</h1>
    <p class="subtitulo-bienvenida">Aprende HTML, CSS y JavaScript jugando, reto a reto.</p>

    <form id="formularioBienvenida">
      <label for="campoNombre">¿Cómo te llamas?</label>
      <input type="text" id="campoNombre" placeholder="Escribe tu nombre" autocomplete="off" maxlength="40" required>
      <p class="error-campo" id="errorNombre"></p>
      <span class="ayuda-campo">
        <i class="fa-solid fa-circle-info"></i>
        Lo usaremos para tu certificado al terminar el programa.
      </span>

      <button type="submit" class="boton-estado boton-comenzar-aventura">
        Comenzar la aventura <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>
  <div class="contacto-flotante" id="contactoFlotante">
    <div class="contacto-flotante__opciones">
      <a class="contacto-flotante__opcion contacto-flotante__opcion--whatsapp"
        href="https://wa.me/593991303169?text=Hola%2C%20tengo%20una%20consulta%20sobre%20TEAM%20CODER%20EXPERIENCE"
        target="_blank" rel="noopener" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      <a class="contacto-flotante__opcion contacto-flotante__opcion--instagram"
        href="https://www.instagram.com/movilisecu/" target="_blank" rel="noopener" title="Instagram"><i
          class="fa-brands fa-instagram"></i></a>
      <a class="contacto-flotante__opcion contacto-flotante__opcion--facebook"
        href="https://www.facebook.com/172671405931562" target="_blank" rel="noopener" title="Facebook"><i
          class="fa-brands fa-facebook-f"></i></a>
      <a class="contacto-flotante__opcion contacto-flotante__opcion--tiktok" href="https://www.tiktok.com/@movilisecu"
        target="_blank" rel="noopener" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
    </div>
    <button class="contacto-flotante__boton" id="botonContacto" aria-label="Contacto y redes sociales"
      aria-expanded="false">
      <span class="contacto-flotante__ping"></span>
      <i class="fa-solid fa-comments" style="position: relative;"></i>
    </button>
  </div>

  <script src="js/contacto.js"></script>
  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/preferencias.js"></script>
  <script src="js/bienvenida.js"></script>

</body>

</html>
