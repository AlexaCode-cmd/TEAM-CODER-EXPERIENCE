<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEAM CODER EXPERIENCE - Bienvenida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bienvenida.css">
</head>

<body class="pagina-bienvenida">

  <div class="tarjeta-bienvenida">
    <img src="assets/img/Movilis Logo Texto Violeta.png" alt="Movilis Instituto Superior Tecnológico"
      class="logo-movilis-completo">
    <h1>TEAM CODER EXPERIENCE</h1>
    <p class="subtitulo-bienvenida">Aprende HTML, CSS y JavaScript jugando, reto a reto.</p>

    <div class="selector-modo-acceso">
      <button type="button" class="selector-modo-acceso__opcion selector-modo-acceso__opcion--activo"
        id="botonModoLogin">Iniciar sesión</button>
      <button type="button" class="selector-modo-acceso__opcion" id="botonModoRegistro">Crear cuenta</button>
    </div>

    <form id="formularioLogin" class="formulario-acceso">
      <label for="campoCorreoLogin">Correo electrónico</label>
      <input type="email" id="campoCorreoLogin" placeholder="tu@correo.com" autocomplete="email" required>

      <label for="campoContrasenaLogin">Contraseña</label>
      <input type="password" id="campoContrasenaLogin" placeholder="Tu contraseña" autocomplete="current-password"
        required>

      <p class="error-campo" id="errorLogin"></p>

      <button type="submit" class="boton-estado boton-comenzar-aventura">
        Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <form id="formularioRegistro" class="formulario-acceso oculto">
      <label for="campoNombreRegistro">¿Cómo te llamas?</label>
      <input type="text" id="campoNombreRegistro" placeholder="Escribe tu nombre" autocomplete="name" maxlength="40"
        required>

      <label for="campoCorreoRegistro">Correo electrónico</label>
      <input type="email" id="campoCorreoRegistro" placeholder="tu@correo.com" autocomplete="email" required>

      <label for="campoContrasenaRegistro">Contraseña</label>
      <input type="password" id="campoContrasenaRegistro" placeholder="Mínimo 6 caracteres" autocomplete="new-password"
        minlength="6" required>

      <p class="error-campo" id="errorRegistro"></p>
      <span class="ayuda-campo">
        <i class="fa-solid fa-circle-info"></i>
        Usaremos tu nombre para tu certificado al terminar el programa.
      </span>

      <button type="submit" class="boton-estado boton-comenzar-aventura">
        Crear cuenta <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/preferencias.js"></script>
  <script src="js/bienvenida.js"></script>
</body>


</html>
